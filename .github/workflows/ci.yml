name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[web,dev]'
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks
      - run: mypy src
      - run: pytest -q
      - run: python -m build
      - run: |
          python -m venv /tmp/opsresolve-wheel
          /tmp/opsresolve-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/opsresolve-wheel/bin/opsresolve demo --state /tmp/opsresolve-smoke --report /tmp/opsresolve-recovery.md
