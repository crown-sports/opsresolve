[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsresolve"
version = "0.2.1"
description = "A local incident workbench with active diagnosis and verified recovery"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "Chris Chen"}]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
model = ["transformers>=4.57,<5", "torch>=2.8,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "httpx>=0.28,<1", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/crown-sports/opsresolve"
Issues = "https://github.com/crown-sports/opsresolve/issues"

[project.scripts]
opsresolve = "opsresolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsresolve = ["ui/*.html", "ui/*.css", "ui/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "uvicorn.*", "fastapi.*"]
ignore_missing_imports = true
